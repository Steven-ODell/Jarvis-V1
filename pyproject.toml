[project]
name = "jarvis"
version = "0.1.0"
description = "Voice assistant for Omarchy: hotkey or wake word, Claude Code brain, Quickshell orb"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2",
    "kokoro-onnx>=0.6",
    "openwakeword>=0.4",
    "sounddevice>=0.5",
    "numpy",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
